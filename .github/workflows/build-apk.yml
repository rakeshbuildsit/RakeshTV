name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu machines already include the Android SDK (ANDROID_HOME is set),
      # so no extra Android setup step is needed.
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk RakeshTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RakeshTV-apk
          path: RakeshTV.apk

      # Publishes the APK at a fixed link:
      # https://github.com/rakeshbuildsit/RakeshTV/releases/latest/download/RakeshTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RakeshTV build ${{ github.run_number }}
          make_latest: true
          files: RakeshTV.apk
