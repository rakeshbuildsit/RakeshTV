name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk LumenTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LumenTV-apk
          path: LumenTV.apk

      # Publishes the APK at a fixed link the TV can download over Wi-Fi:
      # https://github.com/<you>/<repo>/releases/latest/download/LumenTV.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lumen TV build ${{ github.run_number }}
          make_latest: true
          files: LumenTV.apk
